<!doctype html>
<html lang="en" data-orientation="portrait">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Road to 2026 Black Market</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      width: 100%;
      height: 100dvh;
      background: #0d0621;
      overflow: hidden;
    }

    body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0d0621;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    #stage-shell {
      position: relative;
      overflow: hidden;
      background: #0d0621;
    }

    #stage {
      position: absolute;
      inset: 0;
      display: block;
      touch-action: none;
    }

    /* DOM shell sits over canvas */
    #shell {
      position: absolute;
      inset: 0;
      pointer-events: none;
      padding:
        max(env(safe-area-inset-top, 0px), 8px)
        max(env(safe-area-inset-right, 0px), 8px)
        max(env(safe-area-inset-bottom, 0px), 8px)
        max(env(safe-area-inset-left, 0px), 8px);
      display: flex;
      flex-direction: column;
      font-family: 'Arial Black', 'Impact', sans-serif;
    }

    /* ======= HUD ======= */
    #hud {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      background: rgba(8, 3, 22, 0.95);
      border-bottom: 2px solid #c8a020;
      box-shadow: 0 2px 12px rgba(200,160,32,0.25);
      pointer-events: none;
      min-height: 62px;
      flex-shrink: 0;
    }

    .hud-item {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(10, 4, 28, 0.96);
      border: 1.5px solid rgba(200,160,32,0.7);
      border-radius: 6px;
      padding: 4px 8px;
      flex: 1;
      min-width: 0;
      box-shadow: 0 0 8px rgba(200,160,32,0.18), inset 0 0 6px rgba(200,160,32,0.05);
    }

    .hud-icon {
      font-size: 13px;
      line-height: 1;
      flex-shrink: 0;
    }

    .hud-label {
      font-size: 10px;
      font-weight: 900;
      color: #c8a020;
      text-transform: uppercase;
      letter-spacing: 0;
      line-height: 1;
      white-space: nowrap;
    }

    .hud-value {
      font-size: 17px;
      font-weight: 900;
      color: #ffe44d;
      text-shadow: 0 0 8px rgba(255,220,80,0.5);
      line-height: 1;
      white-space: nowrap;
    }

    .hud-col {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    /* Trophy meter */
    #hud-trophy {
      flex: 2;
    }

    .trophy-bar-wrap {
      height: 7px;
      background: rgba(60, 30, 0, 0.6);
      border-radius: 3px;
      overflow: hidden;
      width: 100%;
      margin-top: 3px;
      border: 1px solid rgba(200,160,32,0.3);
    }

    .trophy-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #c8a020, #ffd700, #ff8c00);
      border-radius: 3px;
      width: 0%;
      transition: width 0.4s ease;
      box-shadow: 0 0 6px rgba(255,200,0,0.6);
    }

    /* ======= Scene area (flex grow) ======= */
    #scene-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* ======= Controls ======= */
    #controls {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 8px 12px;
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 12px);
      pointer-events: none;
      flex-shrink: 0;
      min-height: 110px;
    }

    /* Joystick */
    #joystick-zone {
      position: relative;
      width: 100px;
      height: 100px;
      pointer-events: auto;
      flex-shrink: 0;
      touch-action: none;
    }

    #joystick-base {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(80,20,160,0.6) 0%, rgba(30,5,60,0.8) 100%);
      border: 2.5px solid rgba(140, 60, 255, 0.7);
      box-shadow: 0 0 18px rgba(120,40,220,0.5);
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #joystick-base::before,
    #joystick-base::after {
      content: '';
      position: absolute;
      background: rgba(180, 100, 255, 0.3);
    }
    #joystick-base::before { width: 2px; height: 60%; top: 20%; left: 50%; transform: translateX(-50%); }
    #joystick-base::after { height: 2px; width: 60%; top: 50%; left: 20%; transform: translateY(-50%); }

    #joystick-knob {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(200,120,255,0.9), rgba(80,20,160,0.95));
      border: 2px solid rgba(200, 130, 255, 0.9);
      box-shadow: 0 0 12px rgba(160,80,255,0.8), inset 0 0 6px rgba(255,200,255,0.2);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Action button — dark metal, gold neon edge */
    #action-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      background: radial-gradient(circle at 38% 32%, #2a2218, #0e0c08);
      border: 2px solid #c89a30;
      box-shadow: 0 0 10px rgba(200,154,48,0.55), 0 0 3px rgba(200,154,48,0.3) inset, 0 3px 0 #3a2800;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s, box-shadow 0.08s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }

    #action-btn:active {
      transform: scale(0.91) translateY(2px);
      box-shadow: 0 0 6px rgba(200,154,48,0.4), 0 1px 0 #3a2800;
    }

    #action-btn-label {
      font-size: 9px;
      font-weight: 900;
      color: #f0d080;
      text-shadow: 0 0 6px rgba(200,154,48,0.8);
      letter-spacing: 0.5px;
      line-height: 1;
    }

    /* ======= Modal ======= */
    #modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 0, 20, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s;
    }

    #modal-overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    #modal-panel {
      background: linear-gradient(160deg, #1a0050, #0d002e);
      border: 2.5px solid #8800ee;
      border-radius: 10px;
      padding: 28px 24px;
      max-width: 82%;
      text-align: center;
      box-shadow: 0 0 40px rgba(140,0,255,0.5), inset 0 0 20px rgba(60,0,120,0.3);
      position: relative;
    }

    #modal-booth-name {
      font-size: 13px;
      color: #c080ff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    #modal-title {
      font-size: 22px;
      font-weight: 900;
      color: #ffe44d;
      text-shadow: 0 0 12px rgba(255,220,0,0.6);
      line-height: 1.15;
      margin-bottom: 10px;
    }

    #modal-subtitle {
      font-size: 13px;
      color: #d0a0ff;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    #modal-close {
      padding: 10px 28px;
      background: linear-gradient(180deg, #8800ee, #5500aa);
      border: 2px solid #cc44ff;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #modal-close:active { opacity: 0.8; }

    /* Toast */
    #toast-container {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      z-index: 5;
    }

    .toast {
      background: rgba(10, 4, 30, 0.9);
      border: 1.5px solid #8800ee;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 900;
      color: #ffe44d;
      white-space: nowrap;
      animation: toast-in 0.15s ease, toast-out 0.3s ease 1.2s forwards;
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(-10px) scale(0.85); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toast-out {
      from { opacity: 1; }
      to { opacity: 0; transform: translateY(-8px); }
    }

    /* ======= Mini-game controls overlay ======= */
    #mg-controls {
      display: none;
      align-items: flex-end;
      justify-content: space-between;
      padding: 8px 12px;
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 12px);
      pointer-events: none;
      flex-shrink: 0;
      min-height: 110px;
      gap: 8px;
    }

    #mg-result-controls {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 12px);
      pointer-events: none;
      flex-shrink: 0;
      min-height: 110px;
      gap: 12px;
      flex-direction: column;
    }

    #mg-result-info {
      text-align: center;
      pointer-events: none;
    }

    #mg-result-title {
      font-size: 18px;
      font-weight: 900;
      color: #ffe44d;
      text-shadow: 0 0 10px rgba(255,220,0,0.6);
      line-height: 1.2;
    }

    #mg-result-sub {
      font-size: 12px;
      color: #c0e8a0;
      margin-top: 2px;
    }

    #mg-result-reward {
      font-size: 13px;
      font-weight: 900;
      color: #44ff88;
      text-shadow: 0 0 8px rgba(60,255,120,0.5);
      margin-top: 2px;
    }

    #mg-result-btns {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    /* Shared mini-game button base */
    .mg-btn {
      border-radius: 8px;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      font-family: 'Arial Black', Impact, sans-serif;
      font-weight: 900;
      -webkit-tap-highlight-color: transparent;
      border: 2.5px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.07s, box-shadow 0.07s;
    }

    .mg-btn:active { transform: scale(0.91) translateY(2px); }

    #mg-back-btn {
      width: 88px;
      height: 60px;
      background: linear-gradient(180deg, #2a1010, #100808);
      border-color: #884422;
      color: #ffaa66;
      font-size: 13px;
      box-shadow: 0 0 10px rgba(136,68,34,0.5), 0 3px 0 #2a0800;
      text-shadow: 0 0 6px rgba(136,68,34,0.7);
    }

    #mg-stop-btn {
      width: 72px;
      height: 72px;
      background: radial-gradient(circle at 35% 30%, #1a3a1a, #0a180a);
      border-color: #44bb44;
      color: #88ff88;
      font-size: 11px;
      box-shadow: 0 0 10px rgba(68,187,68,0.45), 0 3px 0 #001a00;
      opacity: 0.3;
      pointer-events: none;
      align-self: center;
    }

    #mg-boost-btn {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle at 35% 28%, #2a2a08, #181800);
      border-color: #c8e830;
      color: #c8e830;
      font-size: 13px;
      box-shadow: 0 0 14px rgba(200,232,48,0.6), 0 4px 0 #3a3a00;
      flex-direction: column;
      gap: 2px;
    }

    #mg-boost-btn .boost-arrow {
      font-size: 22px;
      line-height: 1;
    }

    #mg-play-again-btn {
      padding: 13px 22px;
      background: linear-gradient(180deg, #1a4020, #0a2010);
      border-color: #44ff88;
      color: #44ff88;
      font-size: 13px;
      box-shadow: 0 0 12px rgba(68,255,136,0.5), 0 3px 0 #001a00;
      text-shadow: 0 0 6px rgba(68,255,136,0.6);
    }

    #mg-return-btn {
      padding: 13px 22px;
      background: linear-gradient(180deg, #2a1010, #100808);
      border-color: #884422;
      color: #ffaa66;
      font-size: 13px;
      box-shadow: 0 0 10px rgba(136,68,34,0.5), 0 3px 0 #2a0800;
      text-shadow: 0 0 6px rgba(136,68,34,0.6);
    }

    /* ======= HELP button (hub only) ======= */
    #help-btn {
      position: absolute;
      bottom: 116px;
      left: 14px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, #2a1838, #0e0818);
      border: 2px solid #8844cc;
      box-shadow: 0 0 10px rgba(140,60,255,0.5), 0 2px 0 #1a0030;
      color: #cc88ff;
      font-size: 16px;
      font-weight: 900;
      font-family: 'Arial Black', sans-serif;
      cursor: pointer;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 8;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s, box-shadow 0.08s;
    }
    #help-btn:active {
      transform: scale(0.91) translateY(1px);
      box-shadow: 0 0 6px rgba(140,60,255,0.4), 0 1px 0 #1a0030;
    }
    #help-btn.hidden { display: none; }

    /* ======= Tutorial overlay ======= */
    .tut-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 0, 18, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      pointer-events: auto;
      padding: 20px 16px;
    }
    .tut-overlay.tut-sm {
      align-items: flex-end;
      padding-bottom: 120px;
    }
    .tut-panel {
      background: linear-gradient(160deg, #0e0628, #180840);
      border: 2px solid #8844cc;
      border-radius: 8px;
      box-shadow: 0 0 28px rgba(120,50,220,0.5), 0 0 8px rgba(120,50,220,0.3) inset;
      padding: 24px 20px 20px;
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tut-panel-sm {
      padding: 18px 16px 16px;
      max-width: 420px;
    }
    .tut-heading {
      font-size: 18px;
      font-weight: 900;
      color: #ffe44d;
      text-shadow: 0 0 12px rgba(255,220,0,0.5);
      text-align: center;
      letter-spacing: 0;
      line-height: 1.2;
      font-family: 'Arial Black', Impact, sans-serif;
    }
    .tut-sm-heading {
      font-size: 15px;
    }
    .tut-subtitle {
      font-size: 12px;
      color: #cc88ff;
      text-align: center;
      letter-spacing: 1px;
      font-family: 'Arial Black', sans-serif;
    }
    .tut-line {
      font-size: 11px;
      color: #d0b0ff;
      text-align: center;
      font-family: Arial, sans-serif;
    }
    .tut-steps {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tut-steps-sm {
      gap: 6px;
    }
    .tut-step {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 11px;
      color: #e0ccff;
      font-family: Arial, sans-serif;
      line-height: 1.3;
    }
    .tut-step-sm {
      font-size: 11px;
      color: #e0ccff;
      font-family: Arial, sans-serif;
      line-height: 1.4;
      padding: 2px 0;
      border-bottom: 1px solid rgba(120,50,220,0.2);
    }
    .tut-step-sm:last-child { border-bottom: none; }
    .tut-dim { color: #8860aa; font-style: italic; }
    .tut-num {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(140,60,255,0.3);
      border: 1.5px solid #8844cc;
      color: #cc88ff;
      font-size: 10px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Arial Black', sans-serif;
    }
    .tut-btn {
      background: linear-gradient(180deg, #4a00aa, #28006a);
      border: 2px solid #cc88ff;
      border-radius: 6px;
      color: #ffe44d;
      font-size: 13px;
      font-weight: 900;
      font-family: 'Arial Black', Impact, sans-serif;
      padding: 10px 24px;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 0 12px rgba(180,80,255,0.4), 0 3px 0 #150040;
      transition: transform 0.08s;
      -webkit-tap-highlight-color: transparent;
      align-self: center;
    }
    .tut-btn:active { transform: scale(0.93) translateY(1px); }
    .tut-btn-sm { font-size: 11px; padding: 8px 18px; }
    .tut-btn-skip {
      background: transparent;
      border-color: #664488;
      color: #aa88cc;
      box-shadow: none;
    }
    .tut-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* Loading screen */
    #loading-screen {
      position: absolute;
      inset: 0;
      background: #0d0621;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 16px;
    }

    #loading-title {
      font-size: 20px;
      font-weight: 900;
      color: #ffe44d;
      text-shadow: 0 0 16px rgba(255,220,0,0.6);
      text-align: center;
      line-height: 1.2;
    }

    #loading-sub {
      font-size: 12px;
      color: #c080ff;
    }

    #loading-bar-wrap {
      width: 60%;
      height: 6px;
      background: rgba(100,0,180,0.3);
      border-radius: 3px;
      overflow: hidden;
    }

    #loading-bar {
      height: 100%;
      background: linear-gradient(90deg, #8800ee, #ffe44d);
      border-radius: 3px;
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-Q3Q46QUy.js"></script>
</head>
<body>
  <div id="stage-shell">
    <canvas id="stage" aria-label="Road to 2026 Black Market"></canvas>
    <div id="shell">
      <!-- HUD -->
      <div id="hud">
        <div class="hud-item">
          <span class="hud-icon">🪙</span>
          <div class="hud-col">
            <span class="hud-label">COINS</span>
            <span class="hud-value" id="hud-coins">0</span>
          </div>
        </div>
        <div class="hud-item">
          <span class="hud-icon">👥</span>
          <div class="hud-col">
            <span class="hud-label">FANS</span>
            <span class="hud-value" id="hud-fans">0</span>
          </div>
        </div>
        <div class="hud-item">
          <span class="hud-icon">🔥</span>
          <div class="hud-col">
            <span class="hud-label">HYPE</span>
            <span class="hud-value" id="hud-hype">0</span>
          </div>
        </div>
        <div class="hud-item" id="hud-trophy">
          <span class="hud-icon">🏆</span>
          <div class="hud-col" style="flex:1;min-width:0;">
            <span class="hud-label">TROPHY METER</span>
            <span class="hud-value" id="hud-trophy-val">0%</span>
            <div class="trophy-bar-wrap">
              <div class="trophy-bar-fill" id="trophy-bar"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Scene area (canvas shows through here) -->
      <div id="scene-area">
        <!-- Modal overlay -->
        <div id="modal-overlay">
          <div id="modal-panel">
            <div id="modal-booth-name">BOOTH</div>
            <div id="modal-title">MINI GAME<br>COMING SOON</div>
            <div id="modal-subtitle">Stay tuned. The black market<br>never sleeps.</div>
            <button id="modal-close">CLOSE</button>
          </div>
        </div>
        <!-- Toast container -->
        <div id="toast-container"></div>
        <!-- HELP button (hub only) -->
        <button id="help-btn" title="How to play">?</button>
      </div>

      <!-- Controls -->
      <div id="controls">
        <!-- Joystick -->
        <div id="joystick-zone">
          <div id="joystick-base">
            <div id="joystick-knob"></div>
          </div>
        </div>

        <!-- Action button -->
        <button id="action-btn">
          <span id="action-btn-label"></span>
        </button>
      </div>

      <!-- Mini-game gameplay controls (shown during active mini-game) -->
      <div id="mg-controls">
        <button id="mg-back-btn" class="mg-btn">BACK</button>
        <button id="mg-stop-btn" class="mg-btn">STOP</button>
        <button id="mg-boost-btn" class="mg-btn">
          <span class="boost-arrow">▲</span>
          BOOST
        </button>
      </div>

      <!-- Mini-game result controls (shown after result) -->
      <div id="mg-result-controls">
        <div id="mg-result-info">
          <div id="mg-result-title"></div>
          <div id="mg-result-sub"></div>
          <div id="mg-result-reward"></div>
        </div>
        <div id="mg-result-btns">
          <button id="mg-return-btn" class="mg-btn">RETURN TO HUB</button>
          <button id="mg-play-again-btn" class="mg-btn">PLAY AGAIN</button>
        </div>
      </div>
    </div>

    <!-- Loading screen -->
    <div id="loading-screen">
